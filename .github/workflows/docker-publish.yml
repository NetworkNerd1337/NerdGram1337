# Push ghcr.io/networknerd1337/nerdgram1337 when a vX.Y.Z tag is pushed.
# The same tag filter as release.yml. The tag must match package.json
# (scripts/check-version.mjs). Nothing is pushed on pull requests.
# Until the first tag is pushed, the image is not on GHCR. Build it locally.

name: Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Require a stable tag that matches package.json
        run: |
          node scripts/check-version.mjs
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          CODENAME="$(node scripts/codenames.mjs)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "codename=$CODENAME" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/networknerd1337/nerdgram1337
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=NerdGram1337
            org.opencontainers.image.description=Local-first Mermaid diagramming app
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/NetworkNerd1337/NerdGram1337
            org.opencontainers.image.source=https://github.com/NetworkNerd1337/NerdGram1337
            org.opencontainers.image.version=${{ env.version }}
            org.opencontainers.image.codename=${{ env.codename }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NERDGRAM_VERSION=${{ env.version }}
            NERDGRAM_CODENAME=${{ env.codename }}
            NERDGRAM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=nerdgram1337
          for attempt in 1 2 3 4 5 6; do
            if gh api --method PATCH "/user/packages/container/${package}" -f visibility=public; then
              echo "Package visibility is public."
              exit 0
            fi
            echo "Package visibility was not updated (attempt ${attempt})."
            sleep 10
          done
          echo "The image was pushed, but this token could not mark the package public."
          echo "Open the package on GitHub and set its visibility to Public once."
          exit 1
