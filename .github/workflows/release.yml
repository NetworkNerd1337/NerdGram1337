# Publishing a GitHub Release for a vX.Y.Z tag.
# The tag must match the root package.json version. #12 publishes
# ghcr.io/networknerd1337/nerdgram1337:vX.Y.Z from this same tag.
# Keep that image workflow on this version; do not invent a second scheme.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require a stable tag that matches package.json
        run: |
          node scripts/check-version.mjs
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Notes from CHANGELOG
        id: notes
        run: node scripts/changelog-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
