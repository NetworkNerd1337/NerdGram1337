name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Check version
        run: node scripts/check-version.mjs

      - name: Install
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Lint
        run: npm run lint --prefix client

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version
        id: ver
        run: |
          node scripts/check-version.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Build only. Pull requests and pushes to main do not push to GHCR (push: false).
      - name: Build image
        run: |
          docker build \
            --build-arg NERDGRAM_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg NERDGRAM_COMMIT="${{ github.sha }}" \
            -t nerdgram1337:ci .

      - name: Smoke test
        env:
          NERDGRAM_EXPECT_COMMIT: ${{ github.sha }}
        run: bash scripts/docker-smoke.sh nerdgram1337:ci
